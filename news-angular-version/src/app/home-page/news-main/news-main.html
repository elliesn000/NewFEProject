<div class="md:grid grid-cols-2 lg:grid-cols-[minmax(340px,_1fr)_340px_minmax(200px,300px)] gap-5">

    <!-- Left Top -->
    <div id="1a" class="mt-5 md:m-0">
        @if (highlightArticles[0]; as a) {
        <app-news-card class="block" [newsInput]="a" [displayInput]="normalDisplay" />
        }
        @if (highlightArticles[1]; as b) {
        <app-news-card class="hidden md:block border-t mt-3 pt-3" [newsInput]="b" [displayInput]="noimgDisplay" />
        }
    </div>

    <!-- Right -->
    <div id="1b" class="block md:hidden">
        @for (item of mdArticles; track item.id) {
        <app-news-card class="block" [newsInput]="item" [displayInput]="landscapeDisplay" />
        }
    </div>

    <!-- Right-->
    <div id="2a" class="hidden md:block">
        @for (item of normalArticles; track item.id) {
        <app-news-card class="block mb-5" [newsInput]="item" [displayInput]="normalDisplay" />
        }
    </div>

    <!-- Most Read -->
    <div id="3" class="hidden lg:block">
        <mat-tab-group>
            <mat-tab label="Most Read">
                <ng-template matTabContent>
                    <app-news-scrolling [scrollingInput]="mostReadArticles" />
                </ng-template>
            </mat-tab>
            <mat-tab label="Most Commented">
                <ng-template matTabContent>
                    <app-news-scrolling [scrollingInput]="mostCommentedArticles" />
                </ng-template>
            </mat-tab>
        </mat-tab-group>

    </div>
</div>
