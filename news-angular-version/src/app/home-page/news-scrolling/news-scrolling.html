<cdk-virtual-scroll-viewport itemSize="90" class="h-[430px]">
  <div *cdkVirtualFor="let item of scrollingInput(); let i = index"
      class="flex h-[90px] items-start gap-3 border-b py-2">
    <span class="w-8 text-3xl text-gray-400">{{ i + 1 }}</span>
    <span class="line-clamp-3 flex-1">{{ item.title }}</span>
  </div>
</cdk-virtual-scroll-viewport>
