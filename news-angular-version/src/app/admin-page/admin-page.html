<button matButton="outlined"> Create New </button>


<table mat-table [dataSource]="arLocal" class="m-20px w-full mat-shadow-2">
    <ng-container matColumnDef="number">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let article, let i = index"> {{i+1}} </td>
    </ng-container>
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>        
        <td mat-cell *matCellDef="let article, let i = index">
            <a [routerLink]="['/details', i + 1]"> {{article.title}} </a>
        </td>
    </ng-container>

    <ng-container matColumnDef="imagePath">
        <th mat-header-cell *matHeaderCellDef>Image</th>
        <td mat-cell *matCellDef="let article">
            <img [src]="article.imagePath" [alt]="article.title" class="w-30">
        </td>
    </ng-container>

    <ng-container matColumnDef="createDay">
        <th mat-header-cell *matHeaderCellDef>Create Day</th>
        <td mat-cell *matCellDef="let article">{{ article.createDay }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let article">{{ article.status }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;" routerLink="/details/{{i}}"
        class="cursor-pointer"></tr>
</table>

<button (click)="renewClick()" matButton="outlined">Renew</button>
