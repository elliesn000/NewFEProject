<form novalidate (submit)="onSubmit($event)">
    <mat-form-field>
        <mat-label>Title</mat-label>
        <input matInput [formField]="arForm.title" />
    </mat-form-field>
    <app-field-error [field]="arForm.title" />

    <mat-form-field class="w-full">
        <mat-label>Content</mat-label>
        <textarea matInput rows="8" [formField]="arForm.content"></textarea>
    </mat-form-field>
    <app-field-error [field]="arForm.content" />

    <mat-form-field class="w-full">
        <mat-label>Image Link</mat-label>
        <input matInput [formField]="arForm.imagePath" />
    </mat-form-field>
    <app-field-error [field]="arForm.imagePath" />
    @if (imageWarning()) {
    <p class="field-warning">{{ imageWarning() }}</p>
    }

    <mat-form-field class="w-full">
        <mat-label>Status</mat-label>

        <mat-select [formField]="arForm.status">
            <mat-option value="draft">Draft</mat-option>
            <mat-option value="public">Public</mat-option>
        </mat-select>
    </mat-form-field>
    <app-field-error [field]="arForm.status" />

    <div class="button">
        <button matButton="outlined" type="submit">
            {{ submitLabel() }}</button>
        <button matButton="outlined" type="button" (click)="cancelled.emit()">
            Return AdminPage</button>
    </div>

</form>
